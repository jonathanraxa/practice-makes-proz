<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // ## Array Cardio Day 2

    const people = [
      { name: 'Wes', year: 1988 },
      { name: 'Kait', year: 1986 },
      { name: 'Irv', year: 1970 },
      { name: 'Lux', year: 2015 }
    ];

    const comments = [
      { text: 'Love this!', id: 523423 },
      { text: 'Super good', id: 823423 },
      { text: 'You are the best', id: 2039842 },
      { text: 'Ramen is my fav food ever', id: 123523 },
      { text: 'Nice Nice Nice!', id: 542328 }
    ];

    // Some and Every Checks
    // Array.prototype.some() // is at least one person 19 or older?
    console.log('Array.prototype.some()')
    const isTrueAdult = people.some((person) => {
      const currYear = new Date();
      const age = currYear.getFullYear() - person.year;
      return age >= 19;
    })
    console.log(isTrueAdult);
    console.log('------ END ------');
    console.log('');

    // Array.prototype.every() // is everyone 19 or older?
    console.log('Array.prototype.every()')
    const isAllAdult = people.every((person) => {
      const currYear = new Date();
      const age = currYear.getFullYear() - person.year;
      return age >= 19;
    })
    console.log(isAllAdult);
    console.log('------ END ------');
    console.log('');

    // Array.prototype.find()
    // Find is like filter, but instead returns just the one you are looking for
    // find the comment with the ID of 823423
    console.log('Array.prototype.find()')
    const findCommet = comments.find((comment) => {
      return comment.id === 823423;
    })
    console.log(findCommet);
    console.log('------ END ------');
    console.log('');


    // Array.prototype.findIndex()
    // Find the comment with this ID
    console.log('Array.prototype.findIndex()')
    const findCommentIndex = comments.findIndex((comment) => {
      return comment.id === 823423;
    })
    console.log(`Index: ${findCommentIndex}`);
    console.log('------ END ------');
    console.log('');

    // delete the comment with the ID of 823423
    const newComments = [
      ...comments.slice(0, findCommentIndex),
      ...comments.slice(findCommentIndex + 1)
    ];
    console.log('Array.prototype.findIndex() - Delete comment');
    console.log('Original comments:', comments);
    console.log('New comments:', newComments);
    console.log(newComments);         // Shows as a table

  </script>
</body>

</html>
